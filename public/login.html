<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Soinp Gaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d0d0b;
            --secondary-color: #1a1a2e;
            --accent-color: #00ff88;
            --feishu-color: #3370ff;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --border-color: rgba(0, 255, 136, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 60px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .logo {
            font-size: 48px;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: 4px;
            margin-bottom: 10px;
            position: relative;
        }

        .logo::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--accent-color);
            border-radius: 50%;
            top: 50%;
            right: -25px;
            transform: translateY(-50%);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px var(--accent-color); }
            50% { box-shadow: 0 0 25px var(--accent-color); }
        }

        .tagline {
            color: var(--text-muted);
            margin-bottom: 45px;
            font-size: 14px;
        }

        .login-methods {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .login-btn {
            padding: 18px;
            background: linear-gradient(135deg, var(--feishu-color) 0%, #1a5cd9 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 25px rgba(51, 112, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(51, 112, 255, 0.5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn svg {
            width: 24px;
            height: 24px;
        }

        .skip-btn {
            padding: 14px 24px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--accent-color);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .skip-btn:hover {
            background: rgba(0, 255, 136, 0.15);
            border-color: var(--accent-color);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-muted);
            font-size: 13px;
            margin: 10px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .error-message {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 12px;
            padding: 15px;
            color: #ff6b6b;
            font-size: 14px;
            display: none;
            margin-bottom: 20px;
        }

        .success-message {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            color: var(--accent-color);
            font-size: 14px;
            display: none;
            margin-bottom: 20px;
        }

        .user-info {
            display: none;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .user-info h3 {
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .user-info p {
            color: var(--text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 class="logo">SOINP</h1>
        <p class="tagline">Admin Panel Login</p>
        
        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>
        <div class="user-info" id="user-info">
            <h3>Welcome!</h3>
            <p id="user-name"></p>
        </div>
        
        <div class="login-methods" id="login-methods">
            <button class="login-btn" onclick="loginWithFeishu()">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                Login with Feishu (飞书)
            </button>
            
            <div class="divider">or</div>
            
            <button class="skip-btn" onclick="skipLogin()">
                Skip (Local Dev Only)
            </button>
        </div>
    </div>

    <script>
        // 检查 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const userName = urlParams.get('name');
        const error = urlParams.get('error');
        const errorMsg = urlParams.get('msg');

        // 处理飞书回调
        if (token) {
            // 保存 token
            localStorage.setItem('token', token);
            
            // 显示成功信息
            document.getElementById('login-methods').style.display = 'none';
            document.getElementById('success-message').textContent = 'Login successful! Redirecting...';
            document.getElementById('success-message').style.display = 'block';
            
            // 显示用户信息
            if (userName) {
                document.getElementById('user-name').textContent = `Logged in as: ${decodeURIComponent(userName)}`;
                document.getElementById('user-info').style.display = 'block';
            }
            
            // 跳转到管理后台
            setTimeout(() => {
                window.location.href = '/admin.html';
            }, 1500);
        } else if (error) {
            // 显示错误
            document.getElementById('error-message').textContent = errorMsg || 'Authentication failed';
            document.getElementById('error-message').style.display = 'block';
        }

        // 飞书登录
        function loginWithFeishu() {
            window.location.href = '/api/auth/feishu';
        }

        // 跳过登录（仅本地开发）
        function skipLogin() {
            const isLocalDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            
            if (!isLocalDev) {
                alert('Skip login is only available in local development!');
                return;
            }
            
            localStorage.setItem('token', 'dev-token-local');
            window.location.href = '/admin.html';
        }
    </script>
</body>
</html>
