<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokenPlan 用量监控</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 28px;
      color: #667eea;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e74c3c;
      animation: pulse 2s infinite;
    }

    .status-dot.connected {
      background: #2ecc71;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-4px);
    }

    .stat-card h3 {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 36px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 8px;
    }

    .stat-change {
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-change.positive {
      color: #2ecc71;
    }

    .stat-change.negative {
      color: #e74c3c;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    .chart-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .chart-card h3 {
      font-size: 18px;
      color: #333;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chart-container {
      position: relative;
      height: 300px;
    }

    .models-section {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .models-section h3 {
      font-size: 18px;
      color: #333;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .models-table {
      width: 100%;
      border-collapse: collapse;
    }

    .models-table th,
    .models-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    .models-table th {
      background: #f8f9fa;
      font-weight: 600;
      color: #666;
    }

    .models-table tr:hover {
      background: #f8f9fa;
    }

    .refresh-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .refresh-btn:hover {
      background: #5568d3;
      transform: scale(1.05);
    }

    .refresh-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .last-update {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      background: #fee;
      border: 1px solid #fcc;
      color: #c33;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .balance-bar {
      height: 8px;
      background: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 12px;
    }

    .balance-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transition: width 0.5s ease;
    }

    @media (max-width: 768px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        TokenPlan 用量监控
      </h1>
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span id="connectionStatus">连接中...</span>
        <button class="refresh-btn" id="refreshBtn" onclick="refreshData()">
          <span class="loading" id="loadingIcon" style="display: none;"></span>
          刷新数据
        </button>
      </div>
    </header>

    <div id="errorContainer"></div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>总 Token 消耗</h3>
        <div class="stat-value" id="totalTokens">--</div>
        <div class="stat-change positive" id="tokensChange">
          <span>↑</span>
          <span id="tokensChangeValue">计算中...</span>
        </div>
      </div>

      <div class="stat-card">
        <h3>今日消耗</h3>
        <div class="stat-value" id="todayTokens">--</div>
        <div class="stat-change" id="todayChange">
          <span id="todayChangeValue">计算中...</span>
        </div>
      </div>

      <div class="stat-card">
        <h3>API 请求次数</h3>
        <div class="stat-value" id="totalRequests">--</div>
        <div class="stat-change positive" id="requestsChange">
          <span>↑</span>
          <span id="requestsChangeValue">计算中...</span>
        </div>
      </div>

      <div class="stat-card">
        <h3>账户余额</h3>
        <div class="stat-value" id="balance">--</div>
        <div class="balance-bar">
          <div class="balance-fill" id="balanceFill" style="width: 0%"></div>
        </div>
        <div class="last-update" id="balanceInfo">--</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/>
          </svg>
          用量趋势（7天）
        </h3>
        <div class="chart-container">
          <canvas id="trendChart"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 2a10 10 0 0 1 10 10"/>
          </svg>
          模型使用分布
        </h3>
        <div class="chart-container">
          <canvas id="modelChart"></canvas>
        </div>
      </div>
    </div>

    <div class="models-section">
      <h3>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
        模型使用详情
      </h3>
      <table class="models-table">
        <thead>
          <tr>
            <th>模型名称</th>
            <th>调用次数</th>
            <th>Token消耗</th>
            <th>占比</th>
            <th>平均每次消耗</th>
          </tr>
        </thead>
        <tbody id="modelsTableBody">
          <tr>
            <td colspan="5" style="text-align: center; color: #999;">加载中...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 全局变量
    let trendChart = null;
    let modelChart = null;
    let updateInterval = null;

    // 初始化图表
    function initCharts() {
      // 趋势图
      const trendCtx = document.getElementById('trendChart').getContext('2d');
      trendChart = new Chart(trendCtx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: 'Token消耗',
            data: [],
            borderColor: '#667eea',
            backgroundColor: 'rgba(102, 126, 234, 0.1)',
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              position: 'top'
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: {
                color: 'rgba(0, 0, 0, 0.05)'
              }
            },
            x: {
              grid: {
                display: false
              }
            }
          }
        }
      });

      // 模型分布图
      const modelCtx = document.getElementById('modelChart').getContext('2d');
      modelChart = new Chart(modelCtx, {
        type: 'doughnut',
        data: {
          labels: [],
          datasets: [{
            data: [],
            backgroundColor: [
              '#667eea',
              '#764ba2',
              '#f093fb',
              '#f5576c',
              '#4facfe',
              '#00f2fe',
              '#43e97b',
              '#fa709a'
            ]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right'
            }
          }
        }
      });
    }

    // 格式化数字
    function formatNumber(num) {
      if (num >= 1000000) {
        return (num / 1000000).toFixed(2) + 'M';
      } else if (num >= 1000) {
        return (num / 1000).toFixed(2) + 'K';
      }
      return num.toLocaleString();
    }

    // 更新状态指示器
    function updateStatus(connected, message) {
      const dot = document.getElementById('statusDot');
      const statusText = document.getElementById('connectionStatus');
      
      if (connected) {
        dot.classList.add('connected');
      } else {
        dot.classList.remove('connected');
      }
      statusText.textContent = message;
    }

    // 显示错误
    function showError(message) {
      const container = document.getElementById('errorContainer');
      container.innerHTML = `<div class="error-message">${message}</div>`;
      setTimeout(() => {
        container.innerHTML = '';
      }, 5000);
    }

    // 获取数据
    async function fetchData() {
      try {
        const [usageRes, historyRes, modelsRes, balanceRes] = await Promise.all([
          fetch('/api/tokenplan/usage'),
          fetch('/api/tokenplan/usage/history?days=7'),
          fetch('/api/tokenplan/usage/models'),
          fetch('/api/tokenplan/balance')
        ]);

        if (!usageRes.ok || !historyRes.ok || !modelsRes.ok || !balanceRes.ok) {
          throw new Error('API请求失败');
        }

        const usageData = await usageRes.json();
        const historyData = await historyRes.json();
        const modelsData = await modelsRes.json();
        const balanceData = await balanceRes.json();

        if (!usageData.success || !balanceData.success) {
          throw new Error(usageData.message || balanceData.message || '获取数据失败');
        }

        updateStatus(true, '已连接');
        updateDashboard(usageData.data, historyData.data, modelsData.data, balanceData.data);
        
      } catch (error) {
        console.error('获取数据失败:', error);
        updateStatus(false, '连接失败');
        showError('无法获取数据: ' + error.message);
      }
    }

    // 更新仪表板
    function updateDashboard(usage, history, models, balance) {
      // 更新统计数据
      document.getElementById('totalTokens').textContent = formatNumber(usage.totalTokens || 0);
      document.getElementById('todayTokens').textContent = formatNumber(usage.todayTokens || 0);
      document.getElementById('totalRequests').textContent = formatNumber(usage.totalRequests || 0);
      
      // 更新余额
      const balanceValue = balance.balance || balance.remaining || 0;
      const totalBalance = balance.total || balance.limit || 100;
      document.getElementById('balance').textContent = '$' + balanceValue.toFixed(2);
      
      const usedPercent = Math.min((balanceValue / totalBalance) * 100, 100);
      document.getElementById('balanceFill').style.width = usedPercent + '%';
      document.getElementById('balanceInfo').textContent = `剩余 ${usedPercent.toFixed(1)}%`;

      // 更新趋势图
      if (history && history.days) {
        const labels = history.days.map(d => d.date);
        const data = history.days.map(d => d.tokens);
        
        trendChart.data.labels = labels;
        trendChart.data.datasets[0].data = data;
        trendChart.update();
      }

      // 更新模型分布图
      if (models && models.models) {
        const modelNames = models.models.map(m => m.name);
        const modelUsage = models.models.map(m => m.usage);
        
        modelChart.data.labels = modelNames;
        modelChart.data.datasets[0].data = modelUsage;
        modelChart.update();

        // 更新表格
        const tbody = document.getElementById('modelsTableBody');
        const totalUsage = models.models.reduce((sum, m) => sum + m.usage, 0);
        
        tbody.innerHTML = models.models.map(model => {
          const percentage = totalUsage > 0 ? ((model.usage / totalUsage) * 100).toFixed(1) : 0;
          const avgUsage = model.calls > 0 ? (model.usage / model.calls).toFixed(0) : 0;
          return `
            <tr>
              <td><strong>${model.name}</strong></td>
              <td>${formatNumber(model.calls)}</td>
              <td>${formatNumber(model.usage)}</td>
              <td>${percentage}%</td>
              <td>${avgUsage}</td>
            </tr>
          `;
        }).join('');
      }
    }

    // 刷新数据
    function refreshData() {
      const btn = document.getElementById('refreshBtn');
      const loadingIcon = document.getElementById('loadingIcon');
      
      btn.disabled = true;
      loadingIcon.style.display = 'inline-block';
      
      fetchData().finally(() => {
        btn.disabled = false;
        loadingIcon.style.display = 'none';
      });
    }

    // 启动实时更新
    function startRealTimeUpdates() {
      // 每60秒自动刷新
      updateInterval = setInterval(fetchData, 60000);
      
      // 页面可见性变化时调整更新频率
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          clearInterval(updateInterval);
        } else {
          updateInterval = setInterval(fetchData, 60000);
        }
      });
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      initCharts();
      fetchData();
      startRealTimeUpdates();
    });
  </script>
</body>
</html>
